<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Arche">
  <title>Arche lockup</title>
  <!-- The mark IS the typographic A, set in blue, that visually leads into the bone wordmark -->
  <text x="100" y="150"
        dominant-baseline="central"
        fill="#5a93ff"
        font-family="'Söhne', 'Inter Display', 'Instrument Sans', 'Inter', system-ui, sans-serif"
        font-size="170"
        font-weight="700"
        letter-spacing="-4">A</text>
  <text x="220" y="150"
        dominant-baseline="central"
        fill="#e8ecf1"
        font-family="'Söhne', 'Inter Display', 'Instrument Sans', 'Inter', system-ui, sans-serif"
        font-size="140"
        font-weight="700"
        letter-spacing="-3">ARCHE</text>
</svg>
